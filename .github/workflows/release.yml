name: Build installers

# Produces native binaries + installers for Linux, Windows and macOS.
# Runs on every pushed tag like v0.1.0, and on manual dispatch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# the release job needs write access to create the GitHub Release and attach installers
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: opencad-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: opencad-windows
          - os: macos-latest
            target: aarch64-apple-darwin
            name: opencad-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # egui/glow needs these system libs on Linux.
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libglib2.0-dev

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      # macOS: wrap the binary in a .app bundle, then a .dmg.
      - name: Package macOS .app/.dmg
        if: runner.os == 'macOS'
        run: |
          cargo install cargo-bundle --locked || true
          cargo bundle --release --target ${{ matrix.target }} || true
          hdiutil create -volname OpenCAD -srcfolder \
            "target/${{ matrix.target }}/release/bundle/osx/OpenCAD.app" \
            -ov -format UDZO opencad-macos.dmg || \
            cp "target/${{ matrix.target }}/release/opencad-native" opencad-macos

      # Linux: ship the binary plus a .deb via cargo-bundle.
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-bundle --locked || true
          cargo bundle --release --target ${{ matrix.target }} || true
          cp "target/${{ matrix.target }}/release/opencad-native" opencad-linux
          find target -name "*.deb" -exec cp {} opencad-linux.deb \; || true

      - name: Package Windows
        if: runner.os == 'Windows'
        run: Copy-Item "target/${{ matrix.target }}/release/opencad-native.exe" "opencad-windows.exe"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            opencad-macos*
            opencad-linux*
            opencad-windows*
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*/opencad-*"
